<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كلمات - واحة الفكر والأدب</title>

    <!-- الأيقونات والشعارات (Favicon & App Icons) -->
    <link rel="icon" type="image/x-icon" href="1000228262.ico">
    <link rel="shortcut icon" type="image/x-icon" href="1000228262.ico">
    <link rel="apple-touch-icon" href="1000228262.ico">

    <!-- روابط التصميم والتنسيق (CSS) والخطوط الأساسية للمنصة -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* التنسيقات الأساسية المتوافقة مع هيكل المنصة الحالي */
        :root {
            --primary-color: #2b78c5;
            --secondary-color: #f4f6f9;
            --text-color: #333333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--secondary-color);
            color: var(--text-color);
            direction: rtl;
            text-align: right;
        }
        /* يمكنك إضافة بقية أكواد وتنسيقات المنصة الخاصة بك هنا بكل أمان */
    </style>
</head>
<body>

    <!-- الهيكل البرمجي الرئيسي للمنصة والتطبيق -->
    <div id="app-container">
        <!-- شريط التنقل العلوي -->
        <header style="background: #fff; padding: 10px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center;">
            <div class="logo-area" style="display: flex; align-items: center; gap: 10px;">
                <img src="1000228262.ico" alt="شعار كلمات" style="width: 40px; height: 40px; object-fit: contain; border-radius: 8px;">
                <h1 style="font-size: 20px; color: var(--primary-color);">كلمات</h1>
            </div>
            <!-- عناصر التحكم والبحث -->
        </header>

        <!-- محتوى المنصة (الومضات، الأفكار، المنشورات) -->
        <main style="max-width: 800px; margin: 20px auto; padding: 0 15px;">
            <!-- ومضة معرفية اليوم -->
            <section style="background: linear-gradient(135deg, #2b78c5, #1b4f8a); color: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                <h3 style="margin-bottom: 10px; font-size: 16px;"><i class="fa-solid fa-feather"></i> ومضة معرفية اليوم</h3>
                <p style="font-size: 15px; line-height: 1.6;">«دائماً هناك كلمات لا يجيد كتابتها القلم تغوص في قعر النفس ولا تطفو»</p>
            </section>

            <!-- صندوق مشاركة الفكرة -->
            <div style="background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px;">
                <input type="text" placeholder="شارك فكرة، يا جوجو نون..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; margin-bottom: 10px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <button style="background: #eef2f7; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; color: #555;"><i class="fa-regular fa-image"></i> إرفاق وضغط صورة</button>
                    <button style="background: var(--primary-color); color: #fff; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer;">نشر الفكرة</button>
                </div>
            </div>
        </main>
    </div>

    <!-- السكريبتات البرمجية والوظائف الديناميكية للمنصة -->
    <script>
        // كود تشغيل المنصة والتطبيق التفاعلي
        console.log("تم تحميل منصة كلمات بنجاح مع الشعار الجديد والأيقونات.");
    </script>
</body>
</html>
